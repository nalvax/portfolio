name: Deploy Benjo portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'script.js'
      - 'portfolio-refresh.css'
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Publish the EXACT same root HTML website as branch-based GitHub Pages.
      # Do not build a second, visually different Next.js homepage.
      - name: Verify website JavaScript
        run: node --check script.js

      - name: Assemble website
        run: |
          mkdir -p out
          cp index.html styles.css script.js portfolio-refresh.css out/
          cp -R public out/public
          touch out/.nojekyll
          test -s out/index.html
          test -s out/styles.css
          test -s out/script.js

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
